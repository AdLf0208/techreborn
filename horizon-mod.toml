id = "techreborn"
name = "Tech Reborn"
version = "0.2.1"
description = """A port of Tech Reborn for Horizon: the smallest closed energy loop of the mod. A solid fuel
generator burns any item with a cooking-fuel value for a quarter of its smelting ticks and makes
10 E a step into a 10,000 E buffer; a copper cable moves up to 128 E a tick either way through a
512 E buffer and joins its six sides; an electric furnace smelts vanilla smelting recipes for
their own cooking time at 1 E a tick into a 1,000 E buffer, with three slots and the furnace menu.
The rest of Tech Reborn (its other machines, storage, multiblocks, ore chain, cables, tools and
armour) is not in this version yet."""
authors = ["Team Reborn", "modmuss50", "drcrazy", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both. A dedicated server is "server".
side = "both"
# This mod declares its three blocks' block entities, energy buffers and containers, and carries
# the blocks, items and data of the content it registers.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
